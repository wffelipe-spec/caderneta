<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4fa8">
<title>Extrato do lojista · Caderneta</title>
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>html{color-scheme:light}body{margin:0;padding-bottom:24px}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><h1>Extrato</h1><div class="sub" id="familia">Compras confirmadas na conta</div></div>
    <div class="saldo-mini"><div class="lbl">A receber</div><div class="v num" id="aberto">R$ 0,00</div></div></header>
  <div id="estado" class="notice"><span class="row"><span class="spin"></span> Abrindo o extrato…</span></div>
  <p class="small muted">Este extrato é escrito só pelo sistema, no momento em que você confirma. A família não consegue mudar nem apagar nada daqui. Cada compra tem um código de conferência, o mesmo que veio na mensagem do WhatsApp.</p>
  <div class="sheet"><div class="list" id="lista"></div></div>
</div>
<script type="module" src="extrato.js"></script>
</body>
</html>
