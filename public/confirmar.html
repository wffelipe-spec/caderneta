<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4fa8">
<title>Confirmar compra · Caderneta</title>
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>html{color-scheme:light}body{margin:0;padding-bottom:24px}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap" style="max-width:480px">
  <header class="top"><div><h1>Caderneta</h1><div class="sub">Confirmação de compra na conta</div></div></header>
  <div id="estado" class="notice"><span class="row"><span class="spin"></span> Abrindo a compra…</span></div>
  <div class="balcao" id="cartao" hidden>
    <p class="hand" style="text-align:center" id="quem"></p>
    <div id="itens"></div>
    <div class="total" id="total"></div>
    <div id="conf" class="notice"></div>
    <div id="perguntar">
      <p class="small muted" style="text-align:center">Confira os itens e o valor. Se estiver certo, escreva seu nome e confirme.</p>
      <label class="f">Seu nome<input id="nome" placeholder="Ex.: Seu Zé" autocomplete="name" maxlength="60"></label>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="ok fill" id="ok" type="button">Confirmo a compra</button>
        <button class="bad" id="nao" type="button">Tem erro</button>
      </div>
      <div class="row" id="boxNota" hidden style="margin-top:12px">
        <input id="nota" class="grow" placeholder="O que está errado? Ex.: o valor é R$ 12,00" maxlength="300">
        <button class="bad" id="enviarErro" type="button">Enviar</button>
      </div>
    </div>
    <p class="small muted" style="text-align:center;margin-top:12px">Guarde a mensagem do WhatsApp com o código. Toda compra que você confirma também fica no seu extrato, que a família não consegue alterar.</p>
  </div>
</div>
<script type="module" src="confirmar.js"></script>
</body>
</html>
