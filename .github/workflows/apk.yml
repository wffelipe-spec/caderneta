name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node build.mjs
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk caderneta.apk
      - uses: actions/upload-artifact@v5
        with: { name: caderneta-apk, path: caderneta.apk }
      # Publica o APK num link fixo para mandar pelo WhatsApp, só quando o Firebase já estiver configurado.
      - name: Publicar versão
        if: ${{ !contains(github.event.head_commit.message, '[sem-versao]') }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if grep -q "COLE_AQUI" src/config.js; then echo "Firebase ainda não configurado; versão não publicada."; exit 0; fi
          TAG="v$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" caderneta.apk --title "Caderneta $TAG" --notes "Baixe caderneta.apk no celular Android e instale." --latest
